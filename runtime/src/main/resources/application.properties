spring.application.name=agents-room-runtime
# stdout is the shell control path (ready line only); all logs go to stderr (logback-spring.xml).
spring.main.banner-mode=off
# The address (127.0.0.1) and the ephemeral port are forced in RuntimeConfiguration, not here, so that
# SERVER_ADDRESS or SERVER_PORT in the user's environment cannot change them.
# Do not wait for open renderer WebSockets on shutdown: the runtime only ends when the shell is gone.
server.shutdown=immediate
spring.lifecycle.timeout-per-shutdown-phase=3s
# Netty's default 2 s quiet period would only delay the exit after stdin EOF.
spring.reactor.netty.shutdown-quiet-period=0s
# The ACP SDK logs whole JSON-RPC payloads at DEBUG and TRACE (ADR 0003 decision 9): never below INFO,
# whatever the root level. Adapter stderr lines are logged, masked, by agentsroom.runtime.acp.adapter-stderr.
logging.level.com.agentclientprotocol=INFO
