# CI workflow for agents-room (inherited from pixel-agents)
#
# Sprint 0 trimmed the inherited VS Code extension pipeline: the npm package
# checks, the Node 20 package smoke job, the inherited 3 OS x 3 shard e2e
# matrix (VS Code and standalone specs) and the Vercel Allure preview are gone.
# The inherited e2e suite now runs only locally (npm run e2e). The Windows
# desktop e2e job arrives with the desktop shell PR; macOS and Linux come with
# SCRUM-64 (docs/adr/0001-desktop-framework.md, decision 7).

name: CI

# Markdown-only changes skip CI, except e2e/README.md: the blocking inventory
# drift check below covers its generated section. This uses `paths` rather
# than `paths-ignore` because only `paths` lets a later pattern re-include a
# file (patterns apply in order).
on:
  pull_request:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!.github/FUNDING.yml'
      - 'e2e/README.md'
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!.github/FUNDING.yml'
      - 'e2e/README.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Check steps run with continue-on-error so one failure does not stop the
    # others. "Fail If Any Blocking Check Failed" reads each blocking step's
    # outcome and fails the job; advisory steps only show in the step summary.
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        id: install_dependencies
        run: npm ci

      # --- Protocol spec checks (blocking) ---

      - name: Validate AsyncAPI spec
        id: validate_spec
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run asyncapi:validate
        continue-on-error: true

      - name: Generated messages drift check
        id: messages_drift
        if: always() && steps.install_dependencies.outcome == 'success'
        run: |
          npm run asyncapi:generate
          if ! git diff --exit-code core/src/messages.ts; then
            echo "::error::core/src/messages.ts is out of sync with core/asyncapi.yaml. Run 'npm run asyncapi:generate' locally and commit the result."
            exit 1
          fi
        continue-on-error: true

      - name: Contract fixtures check
        id: contract_check
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run contract:check
        continue-on-error: true

      # --- E2E inventory drift (blocking) ---
      # Lists the legacy VS Code / standalone e2e specs, which still exist.
      # .husky/pre-push runs the same check.

      - name: E2E inventory drift check
        id: e2e_inventory_drift
        if: always() && steps.install_dependencies.outcome == 'success'
        run: |
          npm run e2e:inventory
          if ! git diff --exit-code e2e/README.md; then
            echo "::error::e2e/README.md inventory is out of sync with the test suite. Run 'npm run e2e:inventory' locally and commit the result."
            exit 1
          fi
        continue-on-error: true

      # --- Quality Checks (blocking) ---

      - name: Type Check
        id: type_check
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run check-types
        continue-on-error: true

      - name: Lint
        id: lint
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run lint
        continue-on-error: true

      - name: Webview Tests
        id: webview_test
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run test -w webview-ui
        continue-on-error: true

      - name: Format Check
        id: format_check
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run format:check
        continue-on-error: true

      - name: Knip (advisory)
        id: knip
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run knip
        continue-on-error: true

      # --- Build (blocking) ---

      - name: Build
        id: build
        if: always() && steps.install_dependencies.outcome == 'success'
        run: |
          npm run build:extension
          npm run build:webview
        continue-on-error: true

      # --- Server Tests (require build for hook script) ---

      - name: Server Tests
        id: server_test
        if: always() && steps.build.outcome == 'success' && steps.install_dependencies.outcome == 'success'
        run: npm run test -w server
        continue-on-error: true

      # --- Audit Checks (advisory) ---

      - name: Audit Dependencies
        id: audit
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm audit --audit-level=moderate --workspaces --include-workspace-root
        continue-on-error: true

      # --- Summary ---

      - name: Write Step Summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          VALIDATE_SPEC: ${{ steps.validate_spec.outcome }}
          MESSAGES_DRIFT: ${{ steps.messages_drift.outcome }}
          CONTRACT_CHECK: ${{ steps.contract_check.outcome }}
          E2E_INVENTORY_DRIFT: ${{ steps.e2e_inventory_drift.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEBVIEW_TEST: ${{ steps.webview_test.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          KNIP: ${{ steps.knip.outcome }}
        run: |
          status() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "❌ FAIL"; fi
          }
          advisory() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "⚠️ WARN"; fi
          }
          {
            echo "## CI Results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Checkout | $(status "$CHECKOUT") |"
            echo "| Setup Node | $(status "$SETUP_NODE") |"
            echo "| Install dependencies | $(status "$INSTALL_DEPENDENCIES") |"
            echo "| **AsyncAPI spec** | $(status "$VALIDATE_SPEC") |"
            echo "| **Generated messages drift** | $(status "$MESSAGES_DRIFT") |"
            echo "| **Contract fixtures** | $(status "$CONTRACT_CHECK") |"
            echo "| **E2E inventory drift** | $(status "$E2E_INVENTORY_DRIFT") |"
            echo "| **Type check** | $(status "$TYPE_CHECK") |"
            echo "| **Lint** | $(status "$LINT") |"
            echo "| **Webview tests** | $(status "$WEBVIEW_TEST") |"
            echo "| **Format check** | $(status "$FORMAT_CHECK") |"
            echo "| **Build** | $(status "$BUILD") |"
            echo "| **Server tests** | $(status "$SERVER_TEST") |"
            echo "| Audit dependencies _(advisory)_ | $(advisory "$AUDIT") |"
            echo "| Knip _(advisory)_ | $(advisory "$KNIP") |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Final Gate ---

      - name: Fail If Any Blocking Check Failed
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          VALIDATE_SPEC: ${{ steps.validate_spec.outcome }}
          MESSAGES_DRIFT: ${{ steps.messages_drift.outcome }}
          CONTRACT_CHECK: ${{ steps.contract_check.outcome }}
          E2E_INVENTORY_DRIFT: ${{ steps.e2e_inventory_drift.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEBVIEW_TEST: ${{ steps.webview_test.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
        run: |
          failed=0
          for step in CHECKOUT SETUP_NODE INSTALL_DEPENDENCIES \
                      VALIDATE_SPEC MESSAGES_DRIFT CONTRACT_CHECK E2E_INVENTORY_DRIFT \
                      TYPE_CHECK LINT \
                      WEBVIEW_TEST FORMAT_CHECK BUILD SERVER_TEST; do
            val=$(printenv "$step" 2>/dev/null || echo "skipped")
            if [ "$val" != "success" ]; then
              echo "::error::$step failed"
              failed=1
            fi
          done
          exit "$failed"

  # Single aggregate status check: one name to watch instead of every job name
  # (which silently breaks when a job is renamed). Green only when every job in
  # `needs` succeeded, so a new job (the Windows desktop job, for one) only has
  # to be added to `needs`. Before branch protection requires this check, move
  # the Markdown filter out of `on:` (for example into a changes-detection
  # job): a docs-only PR never starts this workflow, and a required check that
  # never reports stays Pending and blocks the merge.
  required-checks:
    name: Required Checks
    if: always()
    needs:
      - ci
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results=$(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          echo "$results"
          if grep -qv '=success$' <<< "$results"; then
            echo "::error::One or more required jobs did not succeed"
            exit 1
          fi
          echo "All required jobs succeeded."
